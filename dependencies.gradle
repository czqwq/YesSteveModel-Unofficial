dependencies {
    elytraModpackVersion {
        // 在这配置的gtnh版本 用于自动拉取依赖版本
        gtnhVersion = "2.9.0"
        // 是否不缓存拉取的依赖清单文件
        manifestNoCache = false
        // 是否自动为输出的jar添加 `gtnhVersion` 后缀
        attachManifestVersionToJar = false
    }
    runtimeOnlyNonPublishable("com.github.GTNewHorizons:NotEnoughItems:2.7.69-GTNH:dev")
    runtimeOnlyNonPublishable("curse.maven:Nashorn-374413:2924946")
    runtimeOnlyNonPublishable("com.github.GTNewHorizons:Angelica:2.1.19:dev")
    compileOnly("org.jetbrains:annotations:26.0.2")
    devOnlyNonPublishable("com.github.GTNewHorizons:Backhand:1.8.0:dev")
    runtimeOnlyNonPublishable rfg.deobf(files("libs/spark.jar"))
    // Baubles-Expanded: 1.7.10 上 Curios 的前身（modid 仍是 "Baubles"；GTNH 2.8.4/2.9.0 随包提供的是
    // BaublesExpanded-2.2.21-GTNH）。这里的版本只影响编译，不构成运行时要求：用到的
    // BaubleExpandedSlots.getIndexesOfAssignedSlotsOfType/getSlotType 在 2.1.5 就已存在，而运行时靠
    // "类在不在"的能力探测 + 失败回退适配任意版本（缺失时 BaublesCompat 优雅降级）。
    devOnlyNonPublishable("com.github.GTNewHorizons:Baubles-Expanded:2.2.21-GTNH:dev")
    devOnlyNonPublishable("com.github.GTNewHorizons:GTNHLib:0.6.40:dev")
    // ImageStream (upstream's `minecraftLibrary("com.github.OpenYSM:ImageStream:-SNAPSHOT")` + jarJar) is vendored as
    // source under `src/main/java/rip/ysm/imagestream/**` together with its two `META-INF/services/javax.imageio.spi.*`
    // files, the same shape as the GeckoLib engine; its decoders are what let `ModelImageConverter` turn every pack
    // image into PNG. See `PROVENANCE.md`.
    // The vendored engine's Bedrock geometry POJOs (software.bernie.geckolib3.geo.raw.pojo) are
    // Jackson-annotated and import plain `com.fasterxml.jackson.*`; the shadow task relocates them.
    implementation("com.fasterxml.jackson.core:jackson-databind:2.9.0")
    implementation("com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.9.0")
    shadowImplementation("com.fasterxml.jackson.core:jackson-databind:2.9.0")
    shadowImplementation("com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.9.0")
    compileOnly("it.unimi.dsi:fastutil:8.5.18")
}
