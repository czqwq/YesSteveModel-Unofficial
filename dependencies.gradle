dependencies {
    elytraModpackVersion {
        // 在这配置的gtnh版本 用于自动拉取依赖版本
        gtnhVersion = "2.9.0"
        // 是否不缓存拉取的依赖清单文件
        manifestNoCache = false
        // 是否自动为输出的jar添加 `gtnhVersion` 后缀
        attachManifestVersionToJar = false
    }
    runtimeOnlyNonPublishable("com.github.GTNewHorizons:NotEnoughItems:2.7.69-GTNH:dev")
    runtimeOnlyNonPublishable("curse.maven:Nashorn-374413:2924946")
    runtimeOnlyNonPublishable("com.github.GTNewHorizons:Angelica:2.1.19:dev")
    compileOnly("org.jetbrains:annotations:26.0.2")
    devOnlyNonPublishable("com.github.GTNewHorizons:Backhand:1.8.0:dev")
    runtimeOnlyNonPublishable rfg.deobf(files("libs/spark.jar"))
    // ServerUtilities：开发运行时依赖（非发布），让 dev 环境下能验证 SU 权限节点/rank GUI 的接线；正式产物不带它，代码侧仍靠反射。
    runtimeOnlyNonPublishable(gtnhDev("ServerUtilities"))
    // Baubles-Expanded（1.7.10 上 Curios 的前身，modid 仍是 "Baubles"）：仅编译用，版本只需覆盖已用的 slot 查询 API，运行时按"类在不在"探测并优雅降级。
    devOnlyNonPublishable("com.github.GTNewHorizons:Baubles-Expanded:2.2.21-GTNH:dev")
    devOnlyNonPublishable("com.github.GTNewHorizons:GTNHLib:0.6.40:dev")
    // ImageStream 已按源码 vendor（rip/ysm/imagestream/** + META-INF/services），与内置 GeckoLib 引擎同形，见 PROVENANCE.md；Jackson 供内核几何 POJO 使用并由 shadow 重定位。
    implementation("com.fasterxml.jackson.core:jackson-databind:2.9.0")
    implementation("com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.9.0")
    shadowImplementation("com.fasterxml.jackson.core:jackson-databind:2.9.0")
    shadowImplementation("com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.9.0")
    compileOnly("it.unimi.dsi:fastutil:8.5.18")
    // TacZ（1.7.10 移植，MIT，https://github.com/czqwq/TacZ）：可选兼容只编译期依赖 API/索引类。
    // libs/tacz-api.jar 是从其构建产物的 com/tacz/guns/api/** + resource/index/** 提取的子集（见 PROVENANCE.md），
    // 产物不打包、运行时由玩家安装的 TacZ 提供真实类；缺失时 compat 不加载（Loader.isModLoaded 门控）。
    compileOnly files("libs/tacz-api.jar")
    // dev 环境里若本机存在 TacZ 仓库构建产物，则一并加载，便于实机验证联动（非发布依赖）。
    def taczDevJar = file(System.getenv("TACZ_DEV_JAR") ?: "../TacZ/build/libs/tacz-1.0-dev.jar")
    if (taczDevJar.isFile()) {
        devOnlyNonPublishable files(taczDevJar)
    }
}

@SuppressWarnings('GrMethodMayBeStatic')
String gtnhDev(String name, String classifier = "dev") {
    return elytraModpackVersion.gtnh(name, classifier)
}
