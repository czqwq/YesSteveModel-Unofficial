dependencies {
    elytraModpackVersion {
        // 在这配置的gtnh版本 用于自动拉取依赖版本
        gtnhVersion = "2.9.0-beta-3"
        // 是否不缓存拉取的依赖清单文件
        manifestNoCache = false
        // 是否自动为输出的jar添加 `gtnhVersion` 后缀
        attachManifestVersionToJar = false
    }
    runtimeOnlyNonPublishable("com.github.GTNewHorizons:NotEnoughItems:2.7.69-GTNH:dev")
    runtimeOnlyNonPublishable("curse.maven:Nashorn-374413:2924946")
    runtimeOnlyNonPublishable("com.github.GTNewHorizons:Angelica:2.1.19:dev")
    compileOnly("org.jetbrains:annotations:26.0.2")
    devOnlyNonPublishable("com.github.GTNewHorizons:Backhand:1.8.0:dev")
    // Baubles-Expanded: 1.7.10 上 Curios 的前身（modid 仍是 "Baubles"；GTNH 2.8.4/2.9.0 随包提供的是
    // BaublesExpanded-2.2.21-GTNH）。这里的版本只影响编译，不构成运行时要求：用到的
    // BaubleExpandedSlots.getIndexesOfAssignedSlotsOfType/getSlotType 在 2.1.5 就已存在，而运行时靠
    // "类在不在"的能力探测 + 失败回退适配任意版本（缺失时 BaublesCompat 优雅降级）。
    devOnlyNonPublishable("com.github.GTNewHorizons:Baubles-Expanded:2.2.21-GTNH:dev")
    devOnlyNonPublishable("com.github.GTNewHorizons:GTNHLib:0.6.40:dev")
    // GeckoLib 3 for 1.7.10 ships as its own mod (mod id `geckolib`). FML loads every mod into one class
    // loader, so a vendored copy here would silently shadow the installed mod; the engine now lives in that
    // jar instead. `libs/` carries the engine's `dev` jar (MCP names) used for compilation and the dev
    // runtime; players install the reobfuscated release jar next to YSMU. Jackson is shaded and relocated
    // inside that jar (software.bernie.geckolib3.shadow.*), so YSMU no longer depends on it.
    compileOnly files("libs/geckolib-5.09.52.417-dev.jar")
    testImplementation files("libs/geckolib-5.09.52.417-dev.jar")
    devOnlyNonPublishable files("libs/geckolib-5.09.52.417-dev.jar")
    // ImageStream: the image decoder library upstream OpenYSM depends on (declared there as
    // `minecraftLibrary("com.github.OpenYSM:ImageStream:-SNAPSHOT")` plus jarJar in OpenYSM/build.gradle).
    // Its pure-Java JPEG/WebP/AVIF decoders are what let the server normalize every pack image to PNG while it
    // parses a model (`ModelImageConverter`), so the client only ever receives PNG - which is why upstream never
    // meets "no image reader" for a WebP/AVIF avatar.
    //
    // It is vendored in `libs/` like the GeckoLib engine rather than pulled from JitPack at build time, because the
    // GTNH convention's `shadowImplementation` relocates its content to `com/fox/ysmu/shadow/...`: the direct
    // decoder calls in `ModelImageConverter` and the `META-INF/services/javax.imageio.spi.*` entries would then
    // point at packages that do not exist. The class files are embedded unrelocated by the block at the end of
    // this file. Refresh the jar from `com.github.OpenYSM:ImageStream:-SNAPSHOT` if upstream fixes a decoder.
    compileOnly files("libs/ImageStream--SNAPSHOT.jar")
    testImplementation files("libs/ImageStream--SNAPSHOT.jar")
    devOnlyNonPublishable files("libs/ImageStream--SNAPSHOT.jar")
    // Gradle 9 no longer adds the JUnit Platform launcher to the test runtime classpath automatically.
    testImplementation("org.junit.jupiter:junit-jupiter-api:5.6.2")
    testImplementation("org.junit.jupiter:junit-jupiter-params:5.6.2")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher:1.6.2")
    testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine:5.6.2")
    // fastutil only reaches the compile classpath transitively through the GTNHLib dev jar,
    // so the test runtime classpath needs it declared explicitly (mod code uses it at runtime).
    testImplementation("it.unimi.dsi:fastutil:8.5.18")

    test {
        useJUnitPlatform()
    }
}

// Embed the vendored ImageStream classes (and its ImageIO SPI entries) into the mod jar, unrelocated - the 1.7.10
// counterpart of upstream's `jarJar`. Its manifest and signature files are excluded so the mod's own manifest wins.
tasks.matching { it.name == 'shadowJar' || it.name == 'jar' }.configureEach { task ->
    task.from(zipTree(file('libs/ImageStream--SNAPSHOT.jar'))) {
        exclude 'META-INF/MANIFEST.MF'
        exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA'
        exclude 'META-INF/maven/**'
    }
    task.duplicatesStrategy = org.gradle.api.file.DuplicatesStrategy.EXCLUDE
}
